<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FF69B4" />
      <stop offset="100%" stop-color="#FF1493" />
    </linearGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 4-point Diamond Starburst -->
  <path d="M50,5 Q50,40 20,45 Q50,50 50,85 Q50,50 80,45 Q50,40 50,5 Z" fill="url(#starGrad)" filter="url(#starGlow)" />
  <!-- Diagonal Sub-rays -->
  <path d="M50,25 Q50,45 35,47 Q50,50 50,70 Q50,50 65,47 Q50,45 50,25 Z" fill="#FFFFFF" opacity="0.9" />
  <circle cx="50" cy="47" r="4" fill="#FFFFFF" />
</svg>
