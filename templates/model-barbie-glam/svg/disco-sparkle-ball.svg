<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="discoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1493" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#FF69B4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF1493" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="facetSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFA6D5" />
      <stop offset="100%" stop-color="#FF1493" />
    </linearGradient>
  </defs>

  <!-- Ambient Disco Glow -->
  <circle cx="80" cy="80" r="75" fill="url(#discoGlow)" />

  <!-- Hanging Chain -->
  <line x1="80" y1="0" x2="80" y2="25" stroke="#FFA6D5" stroke-width="2" stroke-dasharray="2 2" />
  <circle cx="80" cy="26" r="3" fill="#FFFFFF" />

  <!-- The Ball Base -->
  <circle cx="80" cy="80" r="50" fill="#2E041E" stroke="#FF1493" stroke-width="2" />

  <!-- Horizontal Latitude Facet Bands -->
  <ellipse cx="80" cy="80" rx="50" ry="12" fill="none" stroke="#FF85C1" stroke-width="1" opacity="0.6" stroke-dasharray="6 4" />
  <ellipse cx="80" cy="80" rx="50" ry="26" fill="none" stroke="#FF85C1" stroke-width="1" opacity="0.6" stroke-dasharray="6 4" />
  <ellipse cx="80" cy="80" rx="50" ry="40" fill="none" stroke="#FF85C1" stroke-width="1" opacity="0.6" stroke-dasharray="6 4" />

  <!-- Vertical Longitude Facet Arcs -->
  <ellipse cx="80" cy="80" rx="12" ry="50" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7" stroke-dasharray="6 4" />
  <ellipse cx="80" cy="80" rx="28" ry="50" fill="none" stroke="#FFA6D5" stroke-width="1" opacity="0.6" stroke-dasharray="6 4" />
  <ellipse cx="80" cy="80" rx="42" ry="50" fill="none" stroke="#FF69B4" stroke-width="1" opacity="0.5" stroke-dasharray="6 4" />

  <!-- Mirror Facet Highlights -->
  <rect x="68" y="60" width="8" height="6" fill="#FFFFFF" rx="1" />
  <rect x="84" y="66" width="8" height="6" fill="#FFE4F0" rx="1" />
  <rect x="74" y="74" width="9" height="7" fill="#FFFFFF" rx="1" />
  <rect x="60" y="78" width="8" height="6" fill="#FF85C1" rx="1" />
  <rect x="90" y="80" width="8" height="6" fill="#FFFFFF" rx="1" />
  <rect x="78" y="90" width="8" height="6" fill="#FFA6D5" rx="1" />
  <rect x="52" y="68" width="7" height="6" fill="#FFFFFF" rx="1" opacity="0.8" />

  <!-- Flash Sparkle Stars -->
  <!-- Top Left Sparkle -->
  <path d="M42,42 Q42,50 36,50 Q42,50 42,58 Q42,50 48,50 Q42,50 42,42 Z" fill="#FFFFFF" />
  <circle cx="42" cy="50" r="1.5" fill="#FF1493" />

  <!-- Center Right Giant Sparkle -->
  <path d="M115,65 Q115,75 107,75 Q115,75 115,85 Q115,75 123,75 Q115,75 115,65 Z" fill="#FFFFFF" />
  <circle cx="115" cy="75" r="2" fill="#FF1493" />

  <!-- Bottom Left Sparkle -->
  <path d="M50,110 Q50,116 45,116 Q50,116 50,122 Q50,116 55,116 Q50,116 50,110 Z" fill="#FFA6D5" />
</svg>
