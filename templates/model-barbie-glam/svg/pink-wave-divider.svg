<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA6D5" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#FF1493" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#FF69B4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFA6D5" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Main Wave Ribbon -->
  <path d="M0,40 Q300,10 600,40 T1200,40" fill="none" stroke="url(#waveGrad)" stroke-width="3" />
  <!-- Secondary Wave Accent -->
  <path d="M0,48 Q300,75 600,48 T1200,48" fill="none" stroke="#FF1493" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  <!-- Center Starburst Accent -->
  <g transform="translate(600, 40)">
    <circle cx="0" cy="0" r="14" fill="#FFF5F9" stroke="#FF1493" stroke-width="2" />
    <path d="M0,-8 Q0,0 -8,0 Q0,0 0,8 Q0,0 8,0 Q0,0 0,-8 Z" fill="#FF1493" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>
</svg>
