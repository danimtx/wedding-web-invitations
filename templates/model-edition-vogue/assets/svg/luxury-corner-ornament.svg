<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" aria-label="Luxury Corner Ornament">
  <defs>
    <linearGradient id="goldCornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#5E430B"/>
    </linearGradient>
    <linearGradient id="goldCornerSoft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Corner Filigree (Top-Left master reference) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Corner L-Borders -->
    <path d="M 6 6 L 140 6 M 6 6 L 6 140" stroke="url(#goldCornerGrad)" stroke-width="2.5"/>
    <path d="M 12 12 L 120 12 M 12 12 L 12 120" stroke="url(#goldCornerSoft)" stroke-width="1.2" opacity="0.8"/>
    
    <!-- Outer Dot Accents -->
    <circle cx="6" cy="6" r="4" fill="url(#goldCornerSoft)"/>
    <circle cx="140" cy="6" r="2.5" fill="url(#goldCornerSoft)"/>
    <circle cx="6" cy="140" r="2.5" fill="url(#goldCornerSoft)"/>

    <!-- Baroque Spiral Main Volute -->
    <path d="M 22 22 C 45 15 65 30 55 55 C 45 75 25 65 25 45 C 25 35 35 30 42 38 C 48 44 42 50 38 48" 
          stroke="url(#goldCornerGrad)" stroke-width="2.2"/>
    
    <!-- Diagonal Symmetrical Swirls -->
    <path d="M 22 22 L 75 75" stroke="url(#goldCornerSoft)" stroke-width="1.5" stroke-dasharray="2 3"/>
    <circle cx="75" cy="75" r="3.5" fill="url(#goldCornerSoft)"/>
    
    <!-- Upper Flank Scroll -->
    <path d="M 60 12 C 85 14 105 25 95 45 C 88 58 75 52 78 40 C 80 32 88 34 85 38" 
          stroke="url(#goldCornerGrad)" stroke-width="1.8"/>
    
    <!-- Left Flank Scroll -->
    <path d="M 12 60 C 14 85 25 105 45 95 C 58 88 52 75 40 78 C 32 80 34 88 38 85" 
          stroke="url(#goldCornerGrad)" stroke-width="1.8"/>

    <!-- Acanthus Leaves Fill -->
    <g fill="url(#goldCornerGrad)" stroke="none">
      <path d="M 35 22 Q 48 20 45 14 Q 32 16 35 22 Z"/>
      <path d="M 22 35 Q 20 48 14 45 Q 16 32 22 35 Z"/>
      <path d="M 70 12 Q 82 8 80 3 Q 68 6 70 12 Z"/>
      <path d="M 12 70 Q 8 82 3 80 Q 6 68 12 70 Z"/>
      <path d="M 52 52 Q 65 42 60 38 Q 48 48 52 52 Z"/>
      <circle cx="105" cy="6" r="2"/>
      <circle cx="6" cy="105" r="2"/>
    </g>
  </g>
</svg>
