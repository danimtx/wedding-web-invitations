<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Liquid Rose Gold Gradient -->
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C97A68" />
      <stop offset="25%" stop-color="#FCDAD1" />
      <stop offset="50%" stop-color="#E7A18C" />
      <stop offset="75%" stop-color="#F7C4B8" />
      <stop offset="100%" stop-color="#A85C4B" />
    </linearGradient>

    <!-- Mother of Pearl Soft Glow Filter -->
    <filter id="pearlGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Concentric Rose Gold Astronomical Rings -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#roseGoldGrad)" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#roseGoldGrad)" stroke-width="2" stroke-opacity="0.9"/>
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#roseGoldGrad)" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="250" cy="250" r="202" fill="none" stroke="url(#roseGoldGrad)" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Botanical Rose Petal & Vine Accents -->
  <g stroke="url(#roseGoldGrad)" fill="none" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <!-- Left Rose Garland -->
    <path d="M 120 310 C 105 260, 110 190, 150 145 C 180 110, 220 90, 250 86" />
    <path d="M 115 280 Q 98 270, 108 258 Q 120 268, 115 280 Z" fill="url(#roseGoldGrad)" fill-opacity="0.3"/>
    <path d="M 128 200 Q 112 185, 126 175 Q 135 190, 128 200 Z" fill="url(#roseGoldGrad)" fill-opacity="0.3"/>
    <path d="M 175 125 Q 165 105, 185 102 Q 190 120, 175 125 Z" fill="url(#roseGoldGrad)" fill-opacity="0.3"/>

    <!-- Right Rose Garland -->
    <path d="M 380 310 C 395 260, 390 190, 350 145 C 320 110, 280 90, 250 86" />
    <path d="M 385 280 Q 402 270, 392 258 Q 380 268, 385 280 Z" fill="url(#roseGoldGrad)" fill-opacity="0.3"/>
    <path d="M 372 200 Q 388 185, 374 175 Q 365 190, 372 200 Z" fill="url(#roseGoldGrad)" fill-opacity="0.3"/>
    <path d="M 325 125 Q 335 105, 315 102 Q 310 120, 325 125 Z" fill="url(#roseGoldGrad)" fill-opacity="0.3"/>
  </g>

  <!-- Crescent Moon with Rose Stardust at 12 -->
  <g transform="translate(250, 68)" fill="url(#roseGoldGrad)" filter="url(#pearlGlow)">
    <path d="M -8 -8 A 10 10 0 1 0 8 8 A 7.5 7.5 0 1 1 -8 -8 Z" />
    <circle cx="14" cy="-6" r="1.8" />
    <circle cx="-14" cy="6" r="1.5" />
  </g>

  <!-- Astrological Guilloché Rosette in Soft Rose Gold -->
  <g stroke="url(#roseGoldGrad)" fill="none" stroke-width="0.7" opacity="0.35">
    <ellipse cx="250" cy="250" rx="180" ry="100" transform="rotate(15 250 250)" />
    <ellipse cx="250" cy="250" rx="180" ry="100" transform="rotate(45 250 250)" />
    <ellipse cx="250" cy="250" rx="180" ry="100" transform="rotate(75 250 250)" />
    <ellipse cx="250" cy="250" rx="180" ry="100" transform="rotate(105 250 250)" />
    <ellipse cx="250" cy="250" rx="180" ry="100" transform="rotate(135 250 250)" />
    <ellipse cx="250" cy="250" rx="180" ry="100" transform="rotate(165 250 250)" />
  </g>

  <!-- Central Intertwined Monogram: C & M (Camila & Mateo) -->
  <g id="monogram" fill="url(#roseGoldGrad)" filter="url(#pearlGlow)">
    <!-- Letter C -->
    <path d="M 230 192 C 220 180, 200 170, 178 170 C 145 170, 125 198, 125 248 C 125 300, 150 330, 184 330 C 205 330, 224 320, 235 306 L 225 292 C 216 304, 202 312, 185 312 C 160 312, 145 288, 145 248 C 145 210, 160 188, 182 188 C 198 188, 212 196, 220 206 Z" opacity="0.95"/>

    <!-- Ampersand Link in Rose Ribbon -->
    <path d="M 240 238 Q 248 220, 255 238 Q 260 252, 245 268 Q 235 278, 255 278 Q 265 278, 272 270 L 275 276 Q 265 286, 250 286 Q 230 286, 232 262 Q 232 248, 240 238 Z" opacity="0.8"/>

    <!-- Letter M -->
    <path d="M 255 185 L 275 185 L 302 275 L 328 185 L 348 185 L 348 328 L 330 328 L 330 225 L 308 300 L 295 300 L 274 225 L 274 328 L 255 328 Z" opacity="0.95"/>
  </g>

  <!-- Astrological Ribbon Divider -->
  <path d="M 150 365 Q 250 380, 350 365" fill="none" stroke="url(#roseGoldGrad)" stroke-width="1.2" opacity="0.8"/>
  <circle cx="250" cy="372.5" r="3" fill="url(#roseGoldGrad)" />

  <!-- Date in Roman Numerals -->
  <text x="250" y="405" text-anchor="middle" font-family="'Cinzel', 'Bodoni Moda', serif" font-size="13" letter-spacing="6" fill="url(#roseGoldGrad)" font-weight="600">V · XII · MMXXVI</text>
  <text x="250" y="424" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="4" fill="url(#roseGoldGrad)" opacity="0.8">SAN MIGUEL DE ALLENDE</text>
</svg>
