<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Haute Horlogerie Liquid Gold Gradient -->
    <linearGradient id="goldCelestial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA823E" />
      <stop offset="25%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#DFBA73" />
      <stop offset="75%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#8C672A" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="celestialGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Dial Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldCelestial)" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldCelestial)" stroke-width="2" stroke-opacity="0.85"/>
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#goldCelestial)" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="250" cy="250" r="202" fill="none" stroke="url(#goldCelestial)" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- 24 Hour Horological Tick Marks -->
  <g stroke="url(#goldCelestial)" stroke-width="1" opacity="0.6">
    <line x1="250" y1="24" x2="250" y2="32" stroke-width="2" />
    <line x1="250" y1="468" x2="250" y2="476" stroke-width="2" />
    <line x1="24" y1="250" x2="32" y2="250" stroke-width="2" />
    <line x1="468" y1="250" x2="476" y2="250" stroke-width="2" />

    <line x1="90" y1="90" x2="98" y2="98" stroke-width="1.5" />
    <line x1="410" y1="90" x2="402" y2="98" stroke-width="1.5" />
    <line x1="90" y1="410" x2="98" y2="402" stroke-width="1.5" />
    <line x1="410" y1="410" x2="402" y2="402" stroke-width="1.5" />
  </g>

  <!-- Astrological Guilloché Rosette (Geometric Clockwork Center) -->
  <g stroke="url(#goldCelestial)" fill="none" stroke-width="0.8" opacity="0.4">
    <ellipse cx="250" cy="250" rx="190" ry="110" transform="rotate(0 250 250)" />
    <ellipse cx="250" cy="250" rx="190" ry="110" transform="rotate(30 250 250)" />
    <ellipse cx="250" cy="250" rx="190" ry="110" transform="rotate(60 250 250)" />
    <ellipse cx="250" cy="250" rx="190" ry="110" transform="rotate(90 250 250)" />
    <ellipse cx="250" cy="250" rx="190" ry="110" transform="rotate(120 250 250)" />
    <ellipse cx="250" cy="250" rx="190" ry="110" transform="rotate(150 250 250)" />
  </g>

  <!-- Sun & Moon Celestial Icons at 12 and 6 -->
  <!-- Radiant Sun at Apex -->
  <g transform="translate(250, 72)" fill="url(#goldCelestial)" filter="url(#celestialGlow)">
    <circle cx="0" cy="0" r="7" />
    <line x1="0" y1="-12" x2="0" y2="-17" stroke="url(#goldCelestial)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="0" y1="12" x2="0" y2="17" stroke="url(#goldCelestial)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-12" y1="0" x2="-17" y2="0" stroke="url(#goldCelestial)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="12" y1="0" x2="17" y2="0" stroke="url(#goldCelestial)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-8" y1="-8" x2="-12" y2="-12" stroke="url(#goldCelestial)" stroke-width="1.2" stroke-linecap="round" />
    <line x1="8" y1="-8" x2="12" y2="-12" stroke="url(#goldCelestial)" stroke-width="1.2" stroke-linecap="round" />
    <line x1="-8" y1="8" x2="-12" y2="12" stroke="url(#goldCelestial)" stroke-width="1.2" stroke-linecap="round" />
    <line x1="8" y1="8" x2="12" y2="12" stroke="url(#goldCelestial)" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Crescent Moon at Base -->
  <path d="M 242 420 A 12 12 0 1 0 258 436 A 9 9 0 1 1 242 420 Z" fill="url(#goldCelestial)" filter="url(#celestialGlow)" />

  <!-- Constellation Star Accents -->
  <g fill="url(#goldCelestial)" opacity="0.9">
    <!-- Polaris 8-pointed star at top left -->
    <path d="M 120 150 L 122 142 L 130 140 L 122 138 L 120 130 L 118 138 L 110 140 L 118 142 Z" />
    <path d="M 380 150 L 382 142 L 390 140 L 382 138 L 380 130 L 378 138 L 370 140 L 378 142 Z" />
    <circle cx="160" cy="110" r="2" />
    <circle cx="340" cy="110" r="2" />
    <circle cx="95" cy="220" r="1.5" />
    <circle cx="405" cy="220" r="1.5" />
    <circle cx="115" cy="360" r="2" />
    <circle cx="385" cy="360" r="2" />
  </g>

  <!-- Central Intertwined Monogram: V & M (Valentina & Maximiliano) -->
  <g id="monogram" fill="url(#goldCelestial)" filter="url(#celestialGlow)">
    <!-- Letter V -->
    <path d="M 160 185 L 180 185 L 225 315 L 245 315 L 210 185 L 230 185 L 242 225 L 255 185 L 275 185 L 235 328 L 215 328 Z" opacity="0.95"/>
    
    <!-- Letter M -->
    <path d="M 240 185 L 260 185 L 285 275 L 310 185 L 330 185 L 330 328 L 312 328 L 312 225 L 292 300 L 278 300 L 258 225 L 258 328 L 240 328 Z" opacity="0.95"/>
  </g>

  <!-- Astrological Ribbon Divider -->
  <path d="M 150 365 Q 250 380, 350 365" fill="none" stroke="url(#goldCelestial)" stroke-width="1.2" opacity="0.8"/>
  <circle cx="250" cy="372.5" r="3" fill="url(#goldCelestial)" />

  <!-- Date in Astronomical Roman Numerals -->
  <text x="250" y="402" text-anchor="middle" font-family="'Cinzel', 'Bodoni Moda', serif" font-size="13" letter-spacing="6" fill="url(#goldCelestial)" font-weight="600">XXI · XI · MMXXVI</text>
  <text x="250" y="420" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="4" fill="url(#goldCelestial)" opacity="0.75">SAN MIGUEL DE ALLENDE</text>
</svg>
