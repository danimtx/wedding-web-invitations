<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <defs>
    <!-- Gradiente de Oro Líquido Maestro -->
    <linearGradient id="goldLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="25%" stop-color="#F3DC7C" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#EED59B" />
      <stop offset="100%" stop-color="#8A6818" />
    </linearGradient>

    <!-- 1. Esquina Ornamental Barroca -->
    <g id="corner-filigree">
      <path d="M 4,60 L 4,20 C 4,11.16 11.16,4 20,4 L 60,4" fill="none" stroke="url(#goldLiquid)" stroke-width="2" stroke-linecap="round" />
      <path d="M 12,50 L 12,24 C 12,17.37 17.37,12 24,12 L 50,12" fill="none" stroke="url(#goldLiquid)" stroke-width="1" opacity="0.75" />
      <circle cx="20" cy="20" r="3" fill="url(#goldLiquid)" />
      <path d="M 28,4 C 28,16 16,28 4,28" fill="none" stroke="url(#goldLiquid)" stroke-width="1.2" opacity="0.8" />
      <circle cx="4" cy="60" r="2" fill="url(#goldLiquid)" />
      <circle cx="60" cy="4" r="2" fill="url(#goldLiquid)" />
    </g>

    <!-- 2. Divisor Imperial con Diamante Central -->
    <g id="divider-royal">
      <path d="M 0,16 L 140,16 L 160,8 L 180,24 L 200,16 L 340,16" fill="none" stroke="url(#goldLiquid)" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="160" cy="8" r="2.5" fill="url(#goldLiquid)" />
      <circle cx="200" cy="16" r="2.5" fill="url(#goldLiquid)" />
      <polygon points="180,10 186,16 180,22 174,16" fill="url(#goldLiquid)" />
    </g>

    <!-- 3. Sello de Cera Heraldico en SVG -->
    <g id="wax-seal-crest">
      <circle cx="45" cy="45" r="42" fill="#7A0C14" stroke="url(#goldLiquid)" stroke-width="3" />
      <circle cx="45" cy="45" r="36" fill="none" stroke="url(#goldLiquid)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.85" />
      <text x="45" y="52" font-family="'Cinzel', serif" font-size="22" font-weight="700" fill="url(#goldLiquid)" text-anchor="middle">V&amp;F</text>
    </g>
  </defs>
</svg>
