<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" aria-label="Luxury Royal Crest">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF5C2"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#5E430B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Shield / Escudo -->
  <g filter="url(#goldGlow)">
    <!-- Outer Shield Border -->
    <path d="M 150 55 C 205 55 225 90 225 145 C 225 205 175 245 150 260 C 125 245 75 205 75 145 C 75 90 95 55 150 55 Z" 
          fill="none" stroke="url(#goldGrad1)" stroke-width="4"/>
    
    <!-- Inner Shield Border -->
    <path d="M 150 67 C 195 67 213 97 213 145 C 213 195 170 232 150 245 C 130 232 87 195 87 145 C 87 97 105 67 150 67 Z" 
          fill="#1A0A10" fill-opacity="0.6" stroke="url(#goldGrad2)" stroke-width="1.8"/>

    <!-- Imperial Crown / Corona Real -->
    <g transform="translate(150, 42)">
      <path d="M -30 0 L -25 -20 L -12 -8 L 0 -26 L 12 -8 L 25 -20 L 30 0 Z" fill="url(#goldGrad1)"/>
      <circle cx="-25" cy="-22" r="3" fill="url(#goldGrad2)"/>
      <circle cx="0" cy="-28" r="4" fill="url(#goldGrad2)"/>
      <circle cx="25" cy="-22" r="3" fill="url(#goldGrad2)"/>
      <rect x="-32" y="0" width="64" height="6" rx="2" fill="url(#goldGrad1)"/>
      <circle cx="-18" cy="3" r="1.5" fill="#8B2942"/>
      <circle cx="0" cy="3" r="2" fill="#8B2942"/>
      <circle cx="18" cy="3" r="1.5" fill="#8B2942"/>
    </g>

    <!-- Laurel Wreath Left / Laureles Izquierda -->
    <g stroke="url(#goldGrad1)" fill="url(#goldGrad1)">
      <path d="M 68 140 C 65 100 85 75 110 60" fill="none" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Leaves Left -->
      <path d="M 80 80 Q 65 72 75 62 Q 88 70 80 80 Z"/>
      <path d="M 70 102 Q 54 96 62 85 Q 77 92 70 102 Z"/>
      <path d="M 64 128 Q 48 124 54 112 Q 70 117 64 128 Z"/>
      <path d="M 65 155 Q 50 155 54 142 Q 70 144 65 155 Z"/>
      <path d="M 72 182 Q 58 186 60 173 Q 75 170 72 182 Z"/>
      <path d="M 88 208 Q 76 216 75 202 Q 89 196 88 208 Z"/>
      <path d="M 112 232 Q 102 244 98 230 Q 110 220 112 232 Z"/>
    </g>

    <!-- Laurel Wreath Right / Laureles Derecha -->
    <g stroke="url(#goldGrad1)" fill="url(#goldGrad1)" transform="translate(300, 0) scale(-1, 1)">
      <path d="M 68 140 C 65 100 85 75 110 60" fill="none" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 80 80 Q 65 72 75 62 Q 88 70 80 80 Z"/>
      <path d="M 70 102 Q 54 96 62 85 Q 77 92 70 102 Z"/>
      <path d="M 64 128 Q 48 124 54 112 Q 70 117 64 128 Z"/>
      <path d="M 65 155 Q 50 155 54 142 Q 70 144 65 155 Z"/>
      <path d="M 72 182 Q 58 186 60 173 Q 75 170 72 182 Z"/>
      <path d="M 88 208 Q 76 216 75 202 Q 89 196 88 208 Z"/>
      <path d="M 112 232 Q 102 244 98 230 Q 110 220 112 232 Z"/>
    </g>

    <!-- Ribbon / Lazo Inferior -->
    <g transform="translate(150, 262)">
      <path d="M -80 0 C -40 15 40 15 80 0 C 60 18 -60 18 -80 0 Z" fill="url(#goldGrad1)"/>
      <path d="M -80 0 L -95 18 L -68 15 Z" fill="url(#goldGrad2)"/>
      <path d="M 80 0 L 95 18 L 68 15 Z" fill="url(#goldGrad2)"/>
      <circle cx="0" cy="8" r="3" fill="#FFF5C2"/>
    </g>

    <!-- Baroque Arabesque Accents inside Shield -->
    <path d="M 150 85 C 165 100 180 110 180 125 C 180 140 168 148 158 145 C 145 142 145 125 150 120 C 155 115 162 120 160 125" 
          fill="none" stroke="url(#goldGrad1)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 150 85 C 135 100 120 110 120 125 C 120 140 132 148 142 145 C 155 142 155 125 150 120 C 145 115 138 120 140 125" 
          fill="none" stroke="url(#goldGrad1)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 150 155 L 150 215 M 130 185 L 170 185" stroke="url(#goldGrad1)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="150" cy="185" r="4" fill="url(#goldGrad2)"/>
  </g>
</svg>
