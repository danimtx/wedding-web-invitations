<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <defs>
    <!-- Gradiente Oro Champagne Rosado -->
    <linearGradient id="roseGoldMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E6" />
      <stop offset="35%" stop-color="#EED5BF" />
      <stop offset="70%" stop-color="#D4AA85" />
      <stop offset="100%" stop-color="#9E6E4A" />
    </linearGradient>

    <!-- Divisor de Prisma de Cristal con Diamante Central -->
    <g id="divider-crystal-prism">
      <line x1="0" y1="15" x2="140" y2="15" stroke="url(#roseGoldMaster)" stroke-width="1.2" />
      <line x1="220" y1="15" x2="360" y2="15" stroke="url(#roseGoldMaster)" stroke-width="1.2" />
      <!-- Faceta central de diamante -->
      <polygon points="180,5 195,15 180,25 165,15" fill="none" stroke="url(#roseGoldMaster)" stroke-width="1.5" />
      <circle cx="180" cy="15" r="3" fill="url(#roseGoldMaster)" />
      <polygon points="150,15 154,12 158,15 154,18" fill="url(#roseGoldMaster)" />
      <polygon points="206,15 210,12 214,15 210,18" fill="url(#roseGoldMaster)" />
    </g>

    <!-- Esquina Biselada de Alta Joyería -->
    <g id="corner-crystal-bevel">
      <path d="M 5,50 L 5,20 L 20,5 L 50,5" fill="none" stroke="url(#roseGoldMaster)" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 12,42 L 12,24 L 24,12 L 42,12" fill="none" stroke="url(#roseGoldMaster)" stroke-width="0.8" opacity="0.65" />
      <polygon points="20,5 24,12 12,24 5,20" fill="url(#roseGoldMaster)" opacity="0.4" />
      <polygon points="5,50 3,50 3,54 7,54" fill="url(#roseGoldMaster)" />
      <polygon points="50,5 50,3 54,3 54,7" fill="url(#roseGoldMaster)" />
    </g>
  </defs>
</svg>
