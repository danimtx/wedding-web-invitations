<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Hot Pink Neon Gradients -->
    <linearGradient id="neonPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4" />
      <stop offset="50%" stop-color="#FF1493" />
      <stop offset="100%" stop-color="#C70066" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFE4F0" />
      <stop offset="70%" stop-color="#FF85C1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="glamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1493" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#FF69B4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF1493" stop-opacity="0" />
    </radialGradient>
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="170" fill="url(#glamGlow)" />

  <!-- Outer Double Octagon / Diamond Facet Frame -->
  <polygon points="200,20 327,73 380,200 327,327 200,380 73,327 20,200 73,73" fill="none" stroke="url(#neonPinkGrad)" stroke-width="3" filter="url(#neonFilter)" />
  <polygon points="200,32 318,82 368,200 318,318 200,368 82,318 32,200 82,82" fill="none" stroke="url(#chromeGrad)" stroke-width="1.5" opacity="0.8" />

  <!-- Inner Sparkle Ring -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#FF69B4" stroke-width="1" stroke-dasharray="4 8" opacity="0.6" />

  <!-- 4 Big Couture Starbursts on Cardinal Points -->
  <!-- Top Star -->
  <path d="M200,45 Q200,65 190,65 Q200,65 200,85 Q200,65 210,65 Q200,65 200,45 Z" fill="url(#chromeGrad)" />
  <!-- Bottom Star -->
  <path d="M200,315 Q200,335 190,335 Q200,335 200,355 Q200,335 210,335 Q200,335 200,315 Z" fill="url(#chromeGrad)" />
  <!-- Left Star -->
  <path d="M45,200 Q65,200 65,190 Q65,200 85,200 Q65,200 65,210 Q65,200 45,200 Z" fill="url(#chromeGrad)" />
  <!-- Right Star -->
  <path d="M315,200 Q335,200 335,190 Q335,200 355,200 Q335,200 335,210 Q335,200 315,200 Z" fill="url(#chromeGrad)" />

  <!-- Central Heart Shape Background -->
  <path d="M200,140 C175,100 120,110 120,165 C120,215 180,255 200,275 C220,255 280,215 280,165 C280,110 225,100 200,140 Z" fill="#FFE4F0" fill-opacity="0.1" stroke="url(#neonPinkGrad)" stroke-width="2" />

  <!-- Chic Monogram V & R in Haute Pop Typography -->
  <g font-family="'Syne', 'Montserrat', sans-serif" font-weight="800" text-anchor="middle">
    <!-- Letter V (Valentina) -->
    <text x="165" y="222" font-size="82" fill="url(#neonPinkGrad)" filter="url(#neonFilter)">V</text>
    <text x="165" y="222" font-size="82" fill="url(#chromeGrad)">V</text>

    <!-- Stylized Ampersand in Cursive Sparkle -->
    <text x="200" y="210" font-family="'Italianno', cursive" font-size="52" fill="#FFFFFF" opacity="0.95">&amp;</text>

    <!-- Letter R (Rodrigo) -->
    <text x="235" y="222" font-size="82" fill="url(#neonPinkGrad)" filter="url(#neonFilter)">R</text>
    <text x="235" y="222" font-size="82" fill="url(#chromeGrad)">R</text>
  </g>

  <!-- Ribbon Banner with Wedding Year -->
  <rect x="130" y="275" width="140" height="24" rx="12" fill="#FF1493" filter="url(#neonFilter)" opacity="0.9" />
  <rect x="130" y="275" width="140" height="24" rx="12" fill="url(#neonPinkGrad)" />
  <text x="200" y="291" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">MMXXVI</text>

  <!-- Mini Sparkles Floating -->
  <circle cx="150" cy="130" r="2.5" fill="#FFFFFF" />
  <circle cx="255" cy="140" r="3" fill="#FFFFFF" />
  <circle cx="130" cy="245" r="2" fill="#FF69B4" />
  <circle cx="270" cy="250" r="2.5" fill="#FF69B4" />
</svg>
