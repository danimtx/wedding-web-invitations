<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" width="600" height="80" aria-label="Luxury Floral Divider">
  <defs>
    <linearGradient id="goldDivGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C" stop-opacity="0"/>
      <stop offset="15%" stop-color="#8B6914" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF5C2"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#8B6914" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#AA771C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roseCarmesi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83A5A"/>
      <stop offset="50%" stop-color="#8B2942"/>
      <stop offset="100%" stop-color="#4A101D"/>
    </linearGradient>
    <filter id="glowDiv" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#glowDiv)">
    <!-- Base Horizontal Hairlines -->
    <path d="M 30 40 L 255 40 M 345 40 L 570 40" stroke="url(#goldDivGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 90 44 L 245 44 M 355 44 L 510 44" stroke="url(#goldDivGrad)" stroke-width="0.8" opacity="0.6"/>

    <!-- Center Fleur-de-lis / Rose Centerpiece -->
    <g transform="translate(300, 40)">
      <!-- Center Diamond -->
      <polygon points="0,-16 12,0 0,16 -12,0" fill="url(#goldDivGrad)"/>
      <circle cx="0" cy="0" r="4" fill="#FFF8DC"/>
      
      <!-- Central Rosette Petals -->
      <path d="M 0 -16 C -10 -30 10 -30 0 -16 Z" fill="url(#roseCarmesi)"/>
      <circle cx="0" cy="-24" r="2.5" fill="#FFF5C2"/>
      
      <!-- Side Volutes Left -->
      <path d="M -12 0 C -25 -20 -45 -10 -40 5 C -36 18 -20 12 -22 0 C -24 -8 -32 -6 -30 0" 
            fill="none" stroke="url(#goldDivGrad)" stroke-width="2" stroke-linecap="round"/>
      <path d="M -22 0 C -45 5 -60 -15 -80 -2 C -70 -12 -55 -6 -45 -4" 
            fill="none" stroke="url(#goldDivGrad)" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Leaves Left -->
      <path d="M -50 -8 Q -62 -20 -52 -22 Q -45 -14 -50 -8 Z" fill="url(#goldDivGrad)"/>
      <path d="M -70 0 Q -85 -10 -76 -14 Q -68 -5 -70 0 Z" fill="url(#goldDivGrad)"/>
      <circle cx="-38" cy="4" r="2" fill="url(#roseCarmesi)"/>
      <circle cx="-60" cy="-6" r="2" fill="url(#roseCarmesi)"/>

      <!-- Side Volutes Right (Mirrored) -->
      <g transform="scale(-1, 1)">
        <path d="M -12 0 C -25 -20 -45 -10 -40 5 C -36 18 -20 12 -22 0 C -24 -8 -32 -6 -30 0" 
              fill="none" stroke="url(#goldDivGrad)" stroke-width="2" stroke-linecap="round"/>
        <path d="M -22 0 C -45 5 -60 -15 -80 -2 C -70 -12 -55 -6 -45 -4" 
              fill="none" stroke="url(#goldDivGrad)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M -50 -8 Q -62 -20 -52 -22 Q -45 -14 -50 -8 Z" fill="url(#goldDivGrad)"/>
        <path d="M -70 0 Q -85 -10 -76 -14 Q -68 -5 -70 0 Z" fill="url(#goldDivGrad)"/>
        <circle cx="-38" cy="4" r="2" fill="url(#roseCarmesi)"/>
        <circle cx="-60" cy="-6" r="2" fill="url(#roseCarmesi)"/>
      </g>
    </g>

    <!-- Wing Tip Flourishes Left -->
    <path d="M 45 40 C 35 36 20 44 32 48 C 40 50 42 42 45 40 Z" fill="url(#goldDivGrad)"/>
    
    <!-- Wing Tip Flourishes Right -->
    <path d="M 555 40 C 565 36 580 44 568 48 C 560 50 558 42 555 40 Z" fill="url(#goldDivGrad)"/>
  </g>
</svg>
