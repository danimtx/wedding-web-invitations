<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" role="img" aria-labelledby="crystalCrestTitle crystalCrestDesc">
  <title id="crystalCrestTitle">Monograma Joya Cristal · Isabella &amp; Sebastián</title>
  <desc id="crystalCrestDesc">Monograma nupcial geométrico de alta joyería con corte esmeralda octogonal, iniciales I &amp; S y gradientes en oro champagne rosado reflectante.</desc>
  <defs>
    <!-- Gradiente Oro Champagne Rosado (Haute Joaillerie Rose Gold) -->
    <linearGradient id="champagneRoseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E6" />
      <stop offset="25%" stop-color="#EED5BF" />
      <stop offset="50%" stop-color="#D4AA85" />
      <stop offset="75%" stop-color="#E5C2A5" />
      <stop offset="100%" stop-color="#9E6E4A" />
    </linearGradient>

    <!-- Gradiente Reflejo de Prisma Iridiscente -->
    <linearGradient id="prismGleam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9E6E4A" />
      <stop offset="30%" stop-color="#FFFDF7" />
      <stop offset="50%" stop-color="#EAD1BB" />
      <stop offset="70%" stop-color="#D4AA85" />
      <stop offset="100%" stop-color="#6E4528" />
    </linearGradient>

    <!-- Resplandor Iridiscente Radial -->
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7EE" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#EAD1BB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FAF7F5" stop-opacity="0" />
    </radialGradient>

    <!-- Sombra Escultórica de Cristal -->
    <filter id="crystalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8C5C38" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Aura Resplandeciente de Prisma de Luz -->
  <circle cx="300" cy="300" r="240" fill="url(#crystalGlow)" />

  <!-- GEOMETRÍA FACETADA OCTOGONAL (CORTE DIAMANTE / ESMERALDA) -->
  <g id="facet-geometry" filter="url(#crystalShadow)">
    <!-- Marco Octogonal Exterior -->
    <polygon points="200,60 400,60 540,200 540,400 400,540 200,540 60,400 60,200" 
      fill="none" stroke="url(#champagneRoseGold)" stroke-width="1.8" />

    <!-- Bisel Octogonal Intermedio -->
    <polygon points="212,85 388,85 515,212 515,388 388,515 212,515 85,388 85,212" 
      fill="none" stroke="url(#champagneRoseGold)" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.75" />

    <!-- Faceta Octogonal Interior -->
    <polygon points="225,115 375,115 485,225 485,375 375,485 225,485 115,375 115,225" 
      fill="none" stroke="url(#champagneRoseGold)" stroke-width="2.2" />

    <!-- Líneas de Facetado Radial (Corte Brillante) -->
    <line x1="200" y1="60" x2="225" y2="115" stroke="url(#champagneRoseGold)" stroke-width="1" opacity="0.6" />
    <line x1="400" y1="60" x2="375" y2="115" stroke="url(#champagneRoseGold)" stroke-width="1" opacity="0.6" />
    <line x1="540" y1="200" x2="485" y2="225" stroke="url(#champagneRoseGold)" stroke-width="1" opacity="0.6" />
    <line x1="540" y1="400" x2="485" y2="375" stroke="url(#champagneRoseGold)" stroke-width="1" opacity="0.6" />
    <line x1="400" y1="540" x2="375" y2="485" stroke="url(#champagneRoseGold)" stroke-width="1" opacity="0.6" />
    <line x1="200" y1="540" x2="225" y2="485" stroke="url(#champagneRoseGold)" stroke-width="1" opacity="0.6" />
    <line x1="60" y1="400" x2="115" y2="375" stroke="url(#champagneRoseGold)" stroke-width="1" opacity="0.6" />
    <line x1="60" y1="200" x2="115" y2="225" stroke="url(#champagneRoseGold)" stroke-width="1" opacity="0.6" />

    <!-- Estrellas de Brillo de Alta Joyería en Vértices (Compass Stars) -->
    <g id="sparkle-top" transform="translate(300, 60)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="url(#prismGleam)" />
    </g>
    <g id="sparkle-bottom" transform="translate(300, 540)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="url(#prismGleam)" />
    </g>
    <g id="sparkle-left" transform="translate(60, 300)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="url(#prismGleam)" />
    </g>
    <g id="sparkle-right" transform="translate(540, 300)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="url(#prismGleam)" />
    </g>
  </g>

  <!-- ==========================================================
       MONOGRAMA CENTRAL JOYERO · I & S
  =========================================================== -->
  <g id="monogram-initials" filter="url(#crystalShadow)">
    <!-- Letra I Alta Joyería (Fuste Arquitectónico con Remates Biselados) -->
    <g id="letter-I">
      <!-- Fuste vertical central -->
      <path d="M 235,210 L 295,210 L 295,217 L 273,217 L 273,383 L 295,383 L 295,390 L 235,390 L 235,383 L 257,383 L 257,217 L 235,217 Z" fill="url(#champagneRoseGold)" />
      <!-- Diamante facetado en el remate superior -->
      <polygon points="265,196 270,204 265,212 260,204" fill="url(#prismGleam)" />
    </g>

    <!-- Símbolo Ampersand (&) en Caligrafía Fina de Alta Joyería -->
    <g id="symbol-amp" transform="translate(296, 305) scale(0.68)">
      <text x="0" y="0" font-family="'Italiana', 'Cinzel', serif" font-size="75" font-style="italic" font-weight="300" text-anchor="middle" fill="url(#champagneRoseGold)" opacity="0.88">&amp;</text>
    </g>

    <!-- Letra S Esculpida en Bisel y Curvatura Líquida -->
    <g id="letter-S">
      <path d="M 370,230 C 345,212 315,225 315,250 C 315,290 380,290 380,335 C 380,375 330,385 305,365 L 312,352 C 330,366 365,362 365,335 C 365,298 300,298 300,250 C 300,215 345,198 375,220 Z" fill="url(#prismGleam)" />
      <!-- Gota facetada en extremo inferior de la S -->
      <circle cx="304" cy="365" r="3.5" fill="url(#champagneRoseGold)" />
      <circle cx="372" cy="225" r="3.5" fill="url(#champagneRoseGold)" />
    </g>
  </g>

  <!-- LEMA JOYERO EN ARCO INFERIOR -->
  <g id="crystal-banner" transform="translate(0, 10)">
    <path id="arcPath" d="M 190,450 Q 300,485 410,450" fill="none" stroke="none" />
    <text font-family="'Cinzel', serif" font-size="10.5" font-weight="600" letter-spacing="4.5" fill="url(#champagneRoseGold)" text-anchor="middle">
      <textPath href="#arcPath" startOffset="50%">SPLENDOR IN AETERNUM</textPath>
    </text>
  </g>

  <!-- AÑO EN NÚMEROS ROMANOS BISELADOS -->
  <text x="300" y="504" font-family="'Cinzel', serif" font-size="9" font-weight="600" letter-spacing="5" fill="url(#champagneRoseGold)" text-anchor="middle" opacity="0.85">
    MMXXVII
  </text>
</svg>
