<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%">
  <defs>
    <linearGradient id="roseDivider" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C48477" />
      <stop offset="50%" stop-color="#E2A698" />
      <stop offset="100%" stop-color="#A86154" />
    </linearGradient>
  </defs>

  <g stroke="url(#roseDivider)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Center Rose Blossom -->
    <path d="M 150 25 C 142 22, 138 32, 145 38 C 150 42, 158 36, 155 28 C 153 24, 146 26, 148 32 C 149 34, 152 32, 150 30" stroke-width="1.2" fill="url(#roseDivider)" fill-opacity="0.2"/>
    
    <!-- Rose Calyx & Stem -->
    <path d="M 150 40 L 150 50" stroke-width="1.2" />

    <!-- Left Foliage Sprig -->
    <path d="M 148 45 C 120 45, 90 40, 50 40" stroke-width="1" />
    <path d="M 125 45 Q 115 32, 105 40 Q 115 48, 125 45 Z" fill="url(#roseDivider)" fill-opacity="0.3" stroke-width="0.8"/>
    <path d="M 95 42 Q 85 30, 75 38 Q 85 46, 95 42 Z" fill="url(#roseDivider)" fill-opacity="0.3" stroke-width="0.8"/>
    <circle cx="40" cy="40" r="2" fill="url(#roseDivider)" />
    <circle cx="20" cy="40" r="1.2" fill="url(#roseDivider)" />

    <!-- Right Foliage Sprig -->
    <path d="M 152 45 C 180 45, 210 40, 250 40" stroke-width="1" />
    <path d="M 175 45 Q 185 32, 195 40 Q 185 48, 175 45 Z" fill="url(#roseDivider)" fill-opacity="0.3" stroke-width="0.8"/>
    <path d="M 205 42 Q 215 30, 225 38 Q 215 46, 205 42 Z" fill="url(#roseDivider)" fill-opacity="0.3" stroke-width="0.8"/>
    <circle cx="260" cy="40" r="2" fill="url(#roseDivider)" />
    <circle cx="280" cy="40" r="1.2" fill="url(#roseDivider)" />
  </g>
</svg>
