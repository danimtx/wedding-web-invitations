<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" role="img" aria-labelledby="monogramTitle monogramDesc">
  <title id="monogramTitle">Monograma Real Isabella &amp; Mateo</title>
  <desc id="monogramDesc">Elegante monograma de boda con las iniciales I y M entrelazadas en oro imperial con corona y hojas de laurel</desc>
  <defs>
    <!-- Imperial Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="25%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#C79C2E" />
      <stop offset="75%" stop-color="#FAF0CA" />
      <stop offset="100%" stop-color="#8A6818" />
    </linearGradient>

    <!-- Deep Crimson Velvet Accent Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E2B40" />
      <stop offset="100%" stop-color="#4A0E17" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Fine Ring -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4, 3" opacity="0.6" />
  <circle cx="150" cy="150" r="132" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
  <circle cx="150" cy="150" r="124" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5" />

  <!-- Royal Coronet / Crown at top -->
  <g transform="translate(150, 48) scale(0.65)" text-anchor="middle">
    <!-- Crown Base -->
    <path d="M-45,20 L45,20 C45,25 35,28 0,28 C-35,28 -45,25 -45,20 Z" fill="url(#goldGrad)" />
    <!-- Crown Spikes with Pearls -->
    <path d="M-40,20 L-48,-5 L-25,12 L0,-18 L25,12 L48,-5 L40,20 Z" fill="url(#goldGrad)" />
    <circle cx="-48" cy="-8" r="3.5" fill="url(#goldGrad)" />
    <circle cx="-25" cy="9" r="2.5" fill="url(#goldGrad)" />
    <circle cx="0" cy="-22" r="4.5" fill="url(#goldGrad)" />
    <circle cx="25" cy="9" r="2.5" fill="url(#goldGrad)" />
    <circle cx="48" cy="-8" r="3.5" fill="url(#goldGrad)" />
    <!-- Fleur-de-lis detail -->
    <path d="M0,-22 C-6,-30 0,-38 0,-42 C0,-38 6,-30 0,-22 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Laurel Wreath Leaves (Left & Right) -->
  <g stroke="url(#goldGrad)" fill="url(#goldGrad)" stroke-width="0.5">
    <!-- Left Wreath -->
    <path d="M 45,150 C 45,95 85,55 120,45" fill="none" stroke-width="1.5" />
    <path d="M 45,150 C 45,205 85,245 120,255" fill="none" stroke-width="1.5" />
    <!-- Leaves Left Top -->
    <path d="M 50,130 Q 35,125 42,115 Q 52,122 50,130 Z" />
    <path d="M 58,105 Q 45,95 55,88 Q 63,98 58,105 Z" />
    <path d="M 72,82 Q 62,70 74,65 Q 80,76 72,82 Z" />
    <path d="M 92,64 Q 85,50 98,48 Q 102,60 92,64 Z" />
    <!-- Leaves Left Bottom -->
    <path d="M 50,170 Q 35,175 42,185 Q 52,178 50,170 Z" />
    <path d="M 58,195 Q 45,205 55,212 Q 63,202 58,195 Z" />
    <path d="M 72,218 Q 62,230 74,235 Q 80,224 72,218 Z" />
    <path d="M 92,236 Q 85,250 98,252 Q 102,240 92,236 Z" />

    <!-- Right Wreath -->
    <path d="M 255,150 C 255,95 215,55 180,45" fill="none" stroke-width="1.5" />
    <path d="M 255,150 C 255,205 215,245 180,255" fill="none" stroke-width="1.5" />
    <!-- Leaves Right Top -->
    <path d="M 250,130 Q 265,125 258,115 Q 248,122 250,130 Z" />
    <path d="M 242,105 Q 255,95 245,88 Q 237,98 242,105 Z" />
    <path d="M 228,82 Q 238,70 226,65 Q 220,76 228,82 Z" />
    <path d="M 208,64 Q 215,50 202,48 Q 198,60 208,64 Z" />
    <!-- Leaves Right Bottom -->
    <path d="M 250,170 Q 265,175 258,185 Q 248,178 250,170 Z" />
    <path d="M 242,195 Q 255,205 245,212 Q 237,202 242,195 Z" />
    <path d="M 228,218 Q 238,230 226,235 Q 220,224 228,218 Z" />
    <path d="M 208,236 Q 215,250 202,252 Q 198,240 208,236 Z" />
  </g>

  <!-- Central Interlocking Monogram: I & M -->
  <!-- Letter I (Calligraphic Serif) -->
  <g id="letter-I" fill="url(#goldGrad)" stroke="#4A0E17" stroke-width="0.5">
    <!-- Top Serif & Swash -->
    <path d="M 98,102 C 105,95 125,95 132,95 C 130,102 124,106 118,107 L 118,185 C 125,185 132,189 135,198 C 126,198 108,198 98,198 C 101,189 108,185 114,185 L 114,107 C 108,106 102,102 98,102 Z" />
  </g>

  <!-- Ampersand (&) subtle center connector -->
  <path d="M 144,152 C 141,146 145,140 150,140 C 155,140 158,144 156,150 C 152,156 142,164 142,170 C 142,176 147,179 152,179 C 157,179 161,174 163,170 L 166,173 C 163,178 158,182 151,182 C 143,182 137,176 137,168 C 137,159 148,153 151,148 C 153,145 151,143 149,143 C 146,143 144,146 144,150 Z" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Letter M (Calligraphic Majestic Arch) -->
  <g id="letter-M" fill="url(#goldGrad)" stroke="#4A0E17" stroke-width="0.5">
    <!-- Left Stem with flourish -->
    <path d="M 132,115 C 140,100 152,98 160,98 C 168,98 174,104 177,114 C 182,102 192,98 202,98 C 214,98 222,106 220,120 L 214,182 C 218,184 224,187 227,196 C 220,196 206,196 200,196 C 203,188 207,185 210,182 L 215,125 C 216,114 211,108 202,108 C 194,108 186,115 183,126 L 176,182 C 180,185 184,188 186,196 C 180,196 168,196 162,196 C 165,188 169,185 172,182 L 177,125 C 178,114 173,108 165,108 C 157,108 150,115 146,126 L 140,182 C 144,185 148,188 150,196 C 144,196 132,196 126,196 C 129,188 133,185 136,182 Z" />
  </g>

  <!-- Bottom Date Ribbon -->
  <g transform="translate(150, 258)">
    <path d="M-60,0 C-30,5 30,5 60,0 C55,10 30,12 0,12 C-30,12 -55,10 -60,0 Z" fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="0.8" />
    <text x="0" y="8" font-family="'Josefin Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFF2B2" letter-spacing="3" text-anchor="middle">15 . 11 . 2027</text>
  </g>
</svg>
