<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Luxury Wedding Rings">
  <defs>
    <linearGradient id="ringGoldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF8DC"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#5E430B"/>
    </linearGradient>
    <linearGradient id="ringGoldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#ringGlow)">
    <!-- Back Ring (Groom's Ring) -->
    <ellipse cx="85" cy="105" rx="46" ry="50" fill="none" stroke="url(#ringGoldGrad1)" stroke-width="12" transform="rotate(-20, 85, 105)"/>
    <ellipse cx="85" cy="105" rx="46" ry="50" fill="none" stroke="#FFF8DC" stroke-width="1.8" opacity="0.6" transform="rotate(-20, 85, 105)"/>

    <!-- Front Ring (Bride's Ring with Diamond) -->
    <ellipse cx="120" cy="100" rx="44" ry="48" fill="none" stroke="url(#ringGoldGrad2)" stroke-width="10" transform="rotate(20, 120, 100)"/>
    <ellipse cx="120" cy="100" rx="44" ry="48" fill="none" stroke="#FFF8DC" stroke-width="1.5" opacity="0.8" transform="rotate(20, 120, 100)"/>

    <!-- Diamond Setting on Top of Bride's Ring -->
    <g transform="translate(136, 52)">
      <!-- Prongs -->
      <path d="M -10 12 L -6 2 L 6 2 L 10 12 Z" fill="url(#ringGoldGrad1)"/>
      <!-- Brilliant Cut Diamond -->
      <polygon points="0,-16 12,-6 10,0 -10,0 -12,-6" fill="#FFFFFF" opacity="0.95"/>
      <polygon points="-12,-6 0,-16 0,0 -10,0" fill="#E6F2FF" opacity="0.85"/>
      <polygon points="12,-6 0,-16 0,0 10,0" fill="#D4EEFF" opacity="0.85"/>
      <polygon points="-6,-6 0,-16 6,-6 0,0" fill="#FFFFFF"/>
      <!-- Sparkle -->
      <circle cx="0" cy="-8" r="2.5" fill="#FFF"/>
    </g>

    <!-- Rose Petal Accent -->
    <path d="M 60 145 C 50 160 70 175 90 165 C 100 155 85 140 70 142 Z" fill="#8B2942" opacity="0.75"/>
    <path d="M 130 148 C 145 160 160 145 155 130 C 145 130 135 140 130 148 Z" fill="#6B1D2F" opacity="0.85"/>
  </g>
</svg>
