<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Luxury Church Icon">
  <defs>
    <linearGradient id="churchGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#5E430B"/>
    </linearGradient>
  </defs>

  <g stroke="url(#churchGold)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cross on Top -->
    <path d="M 60 12 L 60 26 M 54 18 L 66 18" stroke-width="2.5"/>

    <!-- Central Belfry / Campanario -->
    <path d="M 46 45 L 60 26 L 74 45 Z" stroke-width="2" fill="url(#churchGold)" fill-opacity="0.15"/>
    <rect x="48" y="45" width="24" height="22" stroke-width="2"/>
    <path d="M 56 58 C 56 52 64 52 64 58 L 64 67 L 56 67 Z" fill="url(#churchGold)"/>

    <!-- Main Cathedral Facade -->
    <path d="M 32 67 L 60 48 L 88 67" stroke-width="2"/>
    <rect x="30" y="67" width="60" height="42" rx="2" stroke-width="2"/>

    <!-- Arch Portal Door -->
    <path d="M 50 109 L 50 86 C 50 78 70 78 70 86 L 70 109 Z" stroke-width="2" fill="url(#churchGold)" fill-opacity="0.25"/>
    <path d="M 60 84 L 60 109" stroke-width="1.5"/>

    <!-- Rose Window -->
    <circle cx="60" cy="74" r="6" stroke-width="1.8"/>
    <circle cx="60" cy="74" r="2" fill="url(#churchGold)"/>

    <!-- Side Steeples / Torres Laterales -->
    <path d="M 18 72 L 30 67 L 30 109 L 18 109 Z" stroke-width="1.8"/>
    <path d="M 18 72 L 24 55 L 30 67" stroke-width="1.8"/>
    <path d="M 24 50 L 24 55 M 21 52 L 27 52" stroke-width="1.5"/>

    <path d="M 102 72 L 90 67 L 90 109 L 102 109 Z" stroke-width="1.8"/>
    <path d="M 102 72 L 96 55 L 90 67" stroke-width="1.8"/>
    <path d="M 96 50 L 96 55 M 93 52 L 99 52" stroke-width="1.5"/>

    <!-- Base Steps -->
    <path d="M 12 109 L 108 109 M 8 114 L 112 114" stroke-width="2"/>
  </g>
</svg>
