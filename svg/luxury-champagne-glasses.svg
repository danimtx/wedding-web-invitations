<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Luxury Champagne Toast Icon">
  <defs>
    <linearGradient id="toastGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#5E430B"/>
    </linearGradient>
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF5C2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#toastGold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Flute Glass -->
    <g transform="rotate(-15, 45, 60)">
      <path d="M 38 25 C 38 48 48 55 48 68 L 48 95 M 34 95 L 62 95" stroke-width="2"/>
      <path d="M 58 25 C 58 48 48 55 48 68" stroke-width="2"/>
      <path d="M 38 25 C 44 23 52 23 58 25" stroke-width="2"/>
      <!-- Champagne Liquid -->
      <path d="M 40 38 C 40 48 48 53 48 62 C 48 53 56 48 56 38 Z" fill="url(#toastGold)" fill-opacity="0.3" stroke="none"/>
    </g>

    <!-- Right Flute Glass -->
    <g transform="rotate(15, 75, 60)">
      <path d="M 68 25 C 68 48 78 55 78 68 L 78 95 M 64 95 L 92 95" stroke-width="2"/>
      <path d="M 88 25 C 88 48 78 55 78 68" stroke-width="2"/>
      <path d="M 68 25 C 74 23 82 23 88 25" stroke-width="2"/>
      <!-- Champagne Liquid -->
      <path d="M 70 38 C 70 48 78 53 78 62 C 78 53 86 48 86 38 Z" fill="url(#toastGold)" fill-opacity="0.3" stroke="none"/>
    </g>

    <!-- Clink Sparkle Center -->
    <g transform="translate(60, 28)">
      <circle cx="0" cy="0" r="5" fill="url(#sparkleGrad)" stroke="none"/>
      <path d="M 0 -12 L 0 12 M -12 0 L 12 0" stroke-width="1.8"/>
      <path d="M -6 -6 L 6 6 M -6 6 L 6 -6" stroke-width="1.2"/>
    </g>

    <!-- Effervescent Bubbles -->
    <circle cx="48" cy="18" r="1.5" fill="url(#toastGold)" stroke="none"/>
    <circle cx="72" cy="15" r="2" fill="url(#toastGold)" stroke="none"/>
    <circle cx="55" cy="8" r="1.2" fill="url(#toastGold)" stroke="none"/>
    <circle cx="66" cy="6" r="1.8" fill="url(#toastGold)" stroke="none"/>
  </g>
</svg>
